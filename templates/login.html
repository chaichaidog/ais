<!doctype html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>管理後台 — ARCHIVE_001</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"><link rel="stylesheet" href="{{ url_for('static', filename='admin.css') }}"></head>
<body class="admin-site"><main class="admin-wrap"><div class="section-index">RESTRICTED ACCESS / ARCHIVE_001</div><h1>管理者驗證</h1><p>這裡是文章管理後台，不是隱藏解謎頁面。</p>{% for category, message in get_flashed_messages(with_categories=true) %}<div class="notice {{ category }}">{{ message }}</div>{% endfor %}
{% if enabled %}<form method="post" action="{{ url_for('admin_login') }}"><input type="hidden" name="csrf" value="{{ csrf }}"><label for="password">管理密碼</label><input id="password" name="password" type="password" autocomplete="current-password" required><button type="submit" class="btn btn-primary">登入檔案管理系統 →</button></form>{% else %}<div class="notice error">尚未設定 ADMIN_PASSWORD。請於 Render 的 Environment 設定管理密碼。</div>{% endif %}
<a class="sub-link" href="{{ url_for('index') }}">← 返回個人 Blog</a></main></body></html>
